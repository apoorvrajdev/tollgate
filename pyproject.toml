[project]
name = "tollgate"
version = "0.1.0"
description = "Token-aware rate limiting, model routing and semantic caching for LLM APIs"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]>=2.40.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# The project is run from the repository root and is not installed (no [build-system]).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["app", "tests", "scripts"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.format]
# Recent ruff also formats code blocks in Markdown; the docs hold illustrative snippets only.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
