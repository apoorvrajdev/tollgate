name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    # The job name is the status check that the protect-main ruleset requires. Do not rename it.
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Used only by the `redis integration` step (ADR-0006); localhost is the one network use in tests.
    services:
      redis:
        image: redis:7.4.12
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # The hook tests run the Node.js guards in .githooks/ (ADR-0001).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install
        run: "python -m pip install --only-binary=:all: -r requirements-dev.txt"
      # The five steps below match scripts/check.py, in the same order, so a failure names its step.
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy
      - name: contract
        run: python -m pytest tests/test_openapi_snapshot.py
      - name: pytest
        run: python -m pytest --ignore=tests/test_openapi_snapshot.py
      # Not a check.py step: ADR-0006 allows this one extra step, against the service container above.
      - name: redis integration
        env:
          TOLLGATE_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -m redis_server
