name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    # The job name is the status check that the protect-main ruleset requires. Do not rename it.
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Used only by the `redis integration` step (ADR-0006); localhost is the one network use in tests.
    services:
      redis:
        image: redis:7.4.12
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # The hook tests run the Node.js guards in .githooks/ (ADR-0001).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install
        run: "python -m pip install --only-binary=:all: -r requirements-dev.txt"
      # The five steps below match scripts/check.py, in the same order, so a failure names its step.
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy
      - name: contract
        run: python -m pytest tests/test_openapi_snapshot.py
      - name: pytest
        run: python -m pytest --ignore=tests/test_openapi_snapshot.py
      # Not a check.py step: ADR-0006 allows this one extra step, against the service container above.
      - name: redis integration
        env:
          TOLLGATE_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -m redis_server

  # Builds the image, starts the Compose stack and smoke-tests it (ADR-0017). Its key and token are
  # random values made at run time; no secret is stored anywhere. Not part of the protect-main ruleset
  # unless the owner adds it.
  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make a random key and token
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import secrets
          for name in ("TOLLGATE_API_KEYS", "TOLLGATE_METRICS_TOKEN"):
              value = secrets.token_urlsafe(32)
              print(f"::add-mask::{value}")
              print(f"{name}={value}")
          PY
      # hadolint/hadolint v2.15.1
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - name: compose config
        run: |
          docker compose config --quiet
      - name: compose build
        run: |
          docker compose build
      - name: compose up
        run: |
          docker compose up --wait
      - name: smoke requests
        run: |
          python3 scripts/smoke_container.py
      - name: Redis holds a limiter bucket
        run: |
          keys="$(docker compose exec -T redis redis-cli --scan --pattern 'tollgate:bucket:*')"
          test -n "$keys"
      - name: logs hold a JSON request line
        run: |
          logs="$(docker compose logs --no-log-prefix gateway)"
          grep -q '"event": "http_request"' <<< "$logs"
      - name: gateway runs as non-root
        run: |
          uid="$(docker compose exec -T gateway id -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      - name: image app directory holds only the expected files
        run: |
          test "$(docker compose exec -T gateway ls -A /app | sort | tr '\n' ' ')" = ".venv app deploy "
          test "$(docker compose exec -T gateway ls -A /app/deploy)" = "logging.json"
      - name: graceful shutdown
        run: |
          docker compose stop gateway
          logs="$(docker compose logs --no-log-prefix gateway)"
          grep -q 'Application shutdown complete.' <<< "$logs"
          code="$(docker compose ps -a --format '{{.ExitCode}}' gateway)"
          echo "gateway exit code: $code"
          test "$code" != "137"
      - name: compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
      - name: compose down
        if: always()
        run: |
          docker compose down --volumes
